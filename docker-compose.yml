services:
  db:
    image: postgres:18
    container_name: companies_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432" # Allows you to still connect from your local PC
    volumes:
      - postgres_data:/var/lib/postgresql
    command: >
      bash -c "
      docker-entrypoint.sh postgres &
      until pg_isready -U ${DB_USER} -d ${DB_NAME}; do sleep 1; done;
      psql -U ${DB_USER} -d ${DB_NAME} -c 'CREATE DATABASE ${AIRFLOW_DB_NAME};' || true;
      wait"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  pipeline:
    build: .
    container_name: companies_pipeline
    profiles: [manual]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db # This overrides 'localhost' so it talks to the container
    volumes:
      - ./data:/app/data
      - ./output_docker:/app/output

#################### AIRFLOW #######################

##### AIRFLOW INTERNAL DB INITIALIZATION ####

  airflow-init:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      env_file:
      - .env
      user: "${AIRFLOW_UID}:0"
      environment:
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${AIRFLOW_DB_NAME}
        - AIRFLOW__CORE__EXECUTOR=LocalExecutor
        - AIRFLOW_CLI_LOG_USER=airflow
      depends_on:
        db:
          condition: service_healthy
      command:
        - bash
        - -c
        - |
            airflow db migrate &&
            airflow users create \
              --username ${_AIRFLOW_WWW_USER_USERNAME} \
              --password ${_AIRFLOW_WWW_USER_PASSWORD} \
              --firstname Admin \
              --lastname User \
              --email admin@example.com \
              --role Admin

##### WEB SERVER ####
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file:
      - .env
    container_name: airflow_webserver
    user: "${AIRFLOW_UID}:0"
    restart: always
    ports:
      - "8085:8080"  # Tu UI seguirá estando en localhost:8085
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - PYTHONPATH=/opt/airflow/pipeline_code
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - .:/opt/airflow/pipeline_code:ro
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver

### SCHEDULER ###
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow  
    env_file:
      - .env
    container_name: airflow_scheduler
    user: "${AIRFLOW_UID}:0"
    restart: always
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - DB_HOST=db
      - PYTHONPATH=/opt/airflow/pipeline_code
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - .:/opt/airflow/pipeline_code:ro  
      - ./data:/opt/airflow/data
      - ./output_airflow:/opt/airflow/output
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler


volumes:
  postgres_data:
  pgadmin_data:
